name: china-trade

x-env: &env
  CT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chinatrade}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-chinatrade}
  CT_REDIS_URL: redis://redis:6379/0
  CT_CHAVE_CRIPTO: ${CT_CHAVE_CRIPTO:?gere CT_CHAVE_CRIPTO (veja .env.example)}
  CT_COOKIE_SEGURO: ${CT_COOKIE_SEGURO:-false}
  CT_CADASTRO_ABERTO: ${CT_CADASTRO_ABERTO:-true}
  CT_INTERVALO_COTACOES: ${CT_INTERVALO_COTACOES:-60}
  CT_PASTA_ANEXOS: /app/anexos
  BRAPI_TOKEN: ${BRAPI_TOKEN:-}
  ALPHAVANTAGE_KEY: ${ALPHAVANTAGE_KEY:-}
  ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
  ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
  ALIBABA_APP_KEY: ${ALIBABA_APP_KEY:-}
  ALIBABA_APP_SECRET: ${ALIBABA_APP_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chinatrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chinatrade}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment: *env
    ports: ["127.0.0.1:8000:8000"]
    volumes: [anexos:/app/anexos]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    environment: *env
    command: ["chinatrade", "worker"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  anexos:
