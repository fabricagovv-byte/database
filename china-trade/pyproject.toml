[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chinatrade"
version = "1.0.0"
description = "China Trade & Market Intelligence: importação da China, CRM, vendas, mercado financeiro e alertas"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "pytrends>=4.9",
  "aliyun-python-sdk-core>=2.16",
  "aliyun-python-sdk-alimt>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
chinatrade = "chinatrade.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chinatrade"]

[tool.ruff]
line-length = 180
target-version = "py312"
extend-exclude = ["chinatrade/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "B008", "E731", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
