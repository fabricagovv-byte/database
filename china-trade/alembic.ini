[alembic]
script_location = chinatrade/migrations
# a URL vem de CT_DATABASE_URL (veja migrations/env.py)

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
