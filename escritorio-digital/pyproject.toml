[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "escritorio-digital"
version = "0.1.0"
description = "Escritório digital multiagentes para licitações e execução de contratos públicos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
]

[project.optional-dependencies]
ia = ["anthropic>=1.0"]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
escritorio = "escritorio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["escritorio"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S108", "RUF015"]
"scripts/**" = ["S603", "S607", "RUF015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
