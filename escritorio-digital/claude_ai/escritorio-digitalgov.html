<style>
/* layout: barra de abas fixa no topo (celular primeiro), uma coluna de trabalho; cada aba é um setor do escritório */

--ok:#1b7a43;--aviso:#985a00;--critico:#b42318;--ia:#5b45b0;
--f-disp:"Archivo",system-ui,sans-serif;--f-corpo:"Public Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fundo:#0e141a;--papel:#16202a;--tinta:#e3e8ee;--suave:#98a6b6;--linha:#293543;--acento:#4cc3b9;--acento-txt:#06201e;--acento-suave:#143331;--ok:#5bd08b;--aviso:#f0b450;--critico:#ff8b80;--ia:#b6a2ff;color-scheme:dark}}
:root[data-theme="dark"]{--fundo:#0e141a;--papel:#16202a;--tinta:#e3e8ee;--suave:#98a6b6;--linha:#293543;--acento:#4cc3b9;--acento-txt:#06201e;--acento-suave:#143331;--ok:#5bd08b;--aviso:#f0b450;--critico:#ff8b80;--ia:#b6a2ff;color-scheme:dark}

.marca{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.marca h1{font:800 22px/1 var(--f-disp);font-stretch:80%;margin:0;letter-spacing:.01em}

<script>
"use strict";
/* ===================== utilidades ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const centavos=v=>Math.round(Number(String(v??0).replace(",","."))*100)||0;
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hoje=()=>new Date().toISOString().slice(0,10);
const quando=iso=>iso?new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const pill=(t,k)=>`<span class="pill ${k}">${esc(String(t).replaceAll("_"," "))}</span>`;
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function canon(o){if(Array.isArray(o))return o.map(canon);if(o&&typeof o==="object"){const r={};for(const k of Object.keys(o).sort())r[k]=canon(o[k]);return r}return o}
const hashVersao=async o=>sha256(JSON.stringify(canon(o)));

/* ===================== estado ===================== */
const S={relatorios:[],db:null,user:null,sample:null,assets:null,mcp:null,downloads:null,rotina:null,pedidos:[],rascunho:{},sub:"resumo",filtro:{},dono:false,uid:null,
  empresa:null,servicos:[],documentos:[],ops:[],analises:[],aprovacoes:[],contratos:[],tarefas:[],chamados:[],lanc:[],medicoes:[],entregas:[],
  eventos:[],agentes:[],estadoAg:{},msgs:{},aba:"hoje",opSel:null,chatAg:"assistente-executivo",ocupado:{}};
const ABAS=[["hoje","Hoje"],["vivo","Ao vivo"],["licitacoes","Licitações"],["documentos","Documentos"],["contratos","Contratos"],["financeiro","Financeiro"],["agentes","Agentes"],["empresa","Empresa"]];

/* ===================== eventos (auditoria encadeada, 1 doc por dia) ===================== */
async function evento(tipo,ator,resumo,extra={}){
  if(!S.db) return;
  const dia=hoje(), ref=S.db.doc("eventos/"+dia);
  const snap=await ref.get(); const atual=snap.exists?snap.data():{itens:[]};
  let anterior=atual.itens.length?atual.itens[atual.itens.length-1].hash:(await ultimoHash());
  const item={em:new Date().toISOString(),tipo,ator,resumo:String(resumo).slice(0,400),...extra};
  item.hash=await sha256(anterior+JSON.stringify(canon(item)));item.anterior=anterior;
  const itens=[...atual.itens,item].slice(-600);
  await ref.set({dia,itens});
  if(ator.startsWith("agente:")){const a=ator.slice(7);await setEstadoAg(a,{ultimo:item.resumo,ultimoEm:item.em})}
}
async function ultimoHash(){const ds=S.eventos;return ds.length?ds[0].hash:"0".repeat(64)}
async function setEstadoAg(agente,patch){const ref=S.db.doc("cfg/estado_agentes");const s=await ref.get();const m=s.exists?{...s.data()}:{};m[agente]={...(m[agente]||{}),...patch};await ref.set(m)}

/* ===================== IA pelo plano do usuário ===================== */
async function perguntarIA(agente,prompt,{json=false,tier="default",onText}={}){
  if(!S.sample) throw {code:"indisponivel",message:"IA não disponível nesta visualização"};
  await setEstadoAg(agente,{estado:"trabalhando",tarefa:prompt.split("\n")[0].slice(0,120),desde:new Date().toISOString()});
  try{
    const r=json?await S.sample.json(prompt,{modelTier:tier}):await S.sample(prompt,{modelTier:tier,cache:false,onText});
    await setEstadoAg(agente,{estado:"disponivel",tarefa:null});
    return r;
  }catch(e){await setEstadoAg(agente,{estado:e.code==="cancelled"?"disponivel":"bloqueado",tarefa:e.code==="cancelled"?null:"falha: "+e.code});throw e}
}
const erroIA=e=>({not_granted:"Você não autorizou o uso do Claude nesta página.",rate_limited:"Muitas consultas seguidas. Aguarde um pouco.",usage_limit:"Limite de uso do seu plano atingido.",invalid_json:"A resposta veio fora do formato. Tente de novo.",indisponivel:"IA indisponível nesta visualização."}[e?.code]||("Falha da IA: "+(e?.message||e?.code||e)));

/* ===================== leitura de PDF (no navegador) ===================== */
async function lerPDF(file){
  if(!window.pdfjsLib) throw new Error("Leitor de PDF não carregou");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  const pags=[],sem=[];
  for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const t=(await p.getTextContent()).items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("").trim();pags.push(t);if(t.length<40)sem.push(i)}
  return {paginas:pags,semTexto:sem};
}
const CLASSES=[["retificacao",[/retifica[çc][ãa]o/g,/errata/g]],["edital",[/\bedital\b/g,/preg[ãa]o eletr[ôo]nico/g,/concorr[êe]ncia/g,/termo de refer[êe]ncia/g]],["contrato",[/\bcontrato n/g,/cl[áa]usula primeira/g,/contratante/g]],["certidao",[/certid[ãa]o/g,/regularidade/g]],["atestado",[/atestado de capacidade/g,/atestamos/g]],["balanco",[/balan[çc]o patrimonial/g]]];
function classificar(txt){const t=txt.toLowerCase().slice(0,20000),cab=t.slice(0,300);let melhor="outro",mx=0,seg=0;for(const[c,ps]of CLASSES){const p=ps.reduce((s,r)=>s+(t.match(r)||[]).length+5*(cab.match(r)||[]).length,0);if(p>mx){seg=mx;mx=p;melhor=c}else if(p>seg)seg=p}return{tipo:mx?melhor:"outro",confianca:!mx?"baixa":(mx>=3&&mx>=2*Math.max(seg,1)?"alta":"media")}}
const PADROES=[["habilitacao_documental","certidao_federal",/(receita federal|d[íi]vida ativa da uni[ãa]o|tributos federais)/i,"Certidão federal"],["habilitacao_documental","certidao_fgts",/\bfgts\b/i,"Regularidade do FGTS"],["habilitacao_documental","certidao_trabalhista",/(\bcndt\b|d[ée]bitos trabalhistas)/i,"Certidão trabalhista (CNDT)"],["habilitacao_documental","certidao_estadual",/fazenda estadual/i,"Certidão estadual"],["habilitacao_documental","certidao_municipal",/fazenda municipal/i,"Certidão municipal"],["habilitacao_documental","certidao_falencia",/(fal[êe]ncia|recupera[çc][ãa]o judicial)/i,"Certidão de falência"],["habilitacao_documental","contrato_social",/(ato constitutivo|contrato social|estatuto social)/i,"Contrato social"],["financeiro","balanco",/balan[çc]o patrimonial/i,"Balanço patrimonial"],["financeiro","indices_liquidez",/(liquidez geral|liquidez corrente)/i,"Índices de liquidez"],["financeiro","patrimonio_liquido",/patrim[ôo]nio l[íi]quido m[íi]nimo/i,"Patrimônio líquido mínimo"],["capacidade_tecnica","atestado_capacidade",/atestados? de capacidade t[ée]cnica/i,"Atestado de capacidade técnica"],["capacidade_tecnica","registro_conselho",/\b(crea|cau|crc|cra)\b/i,"Registro em conselho"],["capacidade_operacional","equipe_minima",/equipe m[íi]nima/i,"Equipe mínima"],["capacidade_operacional","sla",/(n[íi]vel m[íi]nimo de servi[çc]o|\bsla\b|acordo de n[íi]vel)/i,"Nível de serviço (SLA)"],["contratual","garantia",/garantia (contratual|de execu[çc][ãa]o)/i,"Garantia contratual"],["contratual","multa",/multa[^.]{0,80}%/i,"Multas"],["contratual","medicao",/(medi[çc][ãa]o|\bust\b|pontos? de fun[çc][ãa]o)/i,"Regra de medição"],["contratual","pagamento",/pagamento[^.]{0,40}(dias|prazo)/i,"Prazo de pagamento"],["contratual","lgpd",/(\blgpd\b|13\.709|prote[çc][ãa]o de dados)/i,"LGPD"],["contratual","subcontratacao",/subcontrata[çc][ãa]o/i,"Subcontratação"]];
function extrairRequisitos(pags){const vistos=new Set(),out=[];pags.forEach((t,i)=>{for(const[cat,ch,rx,desc]of PADROES){if(vistos.has(ch))continue;const m=t.match(rx);if(!m)continue;vistos.add(ch);const a=Math.max(0,m.index-90);out.push({categoria:cat,chave:ch,descricao:desc,pagina:i+1,trecho:t.slice(a,m.index+200).replace(/\s+/g," ")})}});return out}

/* ===================== conformidade (determinística) ===================== */
function avaliar(reqs,docs,dataSessao){
  const ref=dataSessao||hoje();const por={};for(const d of docs)(por[d.tipo]||=[]).push(d);
  return reqs.map(r=>{let sit="informacao_insuficiente",ev="",pend="";const ds=(por[r.chave]||[]).sort((a,b)=>(b.validade||"").localeCompare(a.validade||""));
    if(r.categoria==="habilitacao_documental"||r.chave==="balanco"){if(!ds.length){sit="nao_atende";pend="Cadastrar: "+r.descricao}else{const d=ds[0];ev=d.titulo+(d.validade?" até "+d.validade:"");if(!d.validade){sit="atende_com_condicoes";pend="Validade não informada"}else if(d.validade<ref){sit="nao_atende";pend=`Vence em ${d.validade}, antes da sessão (${ref}). Renovar.`}else sit="atende"}}
    else if(r.chave==="atestado_capacidade"){if(ds.length){sit="atende_com_condicoes";ev=ds.map(d=>d.titulo).join(", ");pend="Conferir objeto e quantitativos"}else{sit="nao_atende";pend="Nenhum atestado cadastrado"}}
    else if(r.categoria==="contratual"){sit="atende_com_condicoes";pend="Risco contratual: revisão jurídica humana"}
    else if(r.categoria==="capacidade_operacional"){sit="atende_com_condicoes";pend="Comparar com a equipe disponível"}
    else pend="Informar dado para comparação";
    return {...r,situacao:sit,evidencia:ev,pendencia:pend}});
}
const COR={atende:"ok",atende_com_condicoes:"aviso",informacao_insuficiente:"aviso",nao_atende:"critico"};

/* ===================== viabilidade (centavos inteiros) ===================== */
function viabilidade({custoDireto,indiretosPct,margemPct,tributoPct,meses,recebDias,pagDias,capital,estimado,precoProposto,margemMin}){
  const indireto=Math.round(custoDireto*indiretosPct/100),custo=custoDireto+indireto;
  const div=1-(tributoPct+margemPct)/100; if(div<=0) throw new Error("Tributos + margem ≥ 100%");
  const sugerido=Math.round(custo/div), preco=precoProposto||sugerido;
  const trib=Math.round(preco*tributoPct/100), lucro=preco-trib-custo, margem=preco?lucro*100/preco:0;
  const n=Math.max(1,meses),lagR=Math.ceil(recebDias/30),lagP=Math.floor(pagDias/30);let saldo=0,pior=0;const fluxo=[];
  for(let m=1;m<=n+Math.max(lagR,lagP)+1;m++){const ent=(m-lagR>=1&&m-lagR<=n)?preco/n:0;const sai=((m-lagP>=1&&m-lagP<=n)?custo/n:0)+((m-lagR>=1&&m-lagR<=n)?trib/n:0);saldo+=ent-sai;pior=Math.min(pior,saldo);fluxo.push({mes:m,saldo:Math.round(saldo)})}
  const giro=Math.round(-pior), alertas=[];
  if(margem<margemMin) alertas.push(`Margem ${margem.toFixed(2)}% abaixo da mínima ${margemMin}%`);
  if(giro>capital) alertas.push(`Capital de giro necessário ${brl(giro)} acima do disponível ${brl(capital)}`);
  if(estimado&&preco>estimado) alertas.push(`Preço ${brl(preco)} acima do estimado ${brl(estimado)}`);
  const rec=alertas.some(a=>/mínima|estimado/.test(a))?"nao_recomendado":alertas.length?"recomendado_com_condicoes":"recomendado";
  return {custo,indireto,sugerido,preco,trib,lucro,margem:+margem.toFixed(2),giro,fluxo,alertas,recomendacao:rec};
}

/* ===================== inicialização ===================== */
async function iniciar(){
  desenharAbas(); render();
  const [db,user,sample,assets,mcp,downloads]=await Promise.all(["db","user","sample","assets","mcp","downloads"].map(n=>claude.use(n).catch(()=>null)));
  S.db=db;S.user=user;S.sample=sample;S.assets=assets;S.mcp=mcp;S.downloads=downloads;
  S.dono=user?await user.isOwner():false; S.uid=user?await user.id():null;
  if(!db){$("#vivo").textContent="● sem banco (abra pelo claude.ai)";render();return}
  $("#vivo").textContent="● ao vivo";$("#vivo").classList.add("on");
  const ouvir=(col,chave,ord)=>{let q=db.collection(col);if(ord)q=q.orderBy(ord,"desc");q.limit(500).onSnapshot(s=>{S[chave]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(col,e.code))};
  db.doc("cfg/empresa").onSnapshot(s=>{S.empresa=s.exists?s.data():null;render()});
  db.doc("cfg/agentes").onSnapshot(s=>{S.agentes=s.exists?s.data().lista||[]:[];render()});
  db.doc("cfg/rotina").onSnapshot(s=>{S.rotina=s.exists?s.data():null});
  ouvir("pedidos","pedidos","criado_em");
  db.collection("relatorios").orderBy("criado_em","desc").limit(5).onSnapshot(s=>{S.relatorios=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.doc("cfg/estado_agentes").onSnapshot(s=>{S.estadoAg=s.exists?s.data():{};render()});
  db.collection("eventos").orderBy("dia","desc").limit(7).onSnapshot(s=>{const todos=[];for(const d of s.docs)for(const it of(d.data().itens||[]))todos.push(it);S.eventos=todos.sort((a,b)=>b.em.localeCompare(a.em));render()});
  ouvir("servicos","servicos");ouvir("documentos","documentos","criado_em");ouvir("oportunidades","ops","aderencia");ouvir("analises","analises","criado_em");

function aderencia(obj){const t=" "+obj.toLowerCase().replace(/sistema de registro de pre[çc]os?|registro de pre[çc]os/g," ")+" ";let p=0;for(const s of S.servicos){const ex=(s.palavras_excluir||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);if(ex.some(x=>t.includes(x)))continue;for(const k of(s.palavras_chave||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean)){if(new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b").test(t))p+=k.includes(" ")?40:15}}return Math.min(100,p)}

const CACHE_TXT={};
async function carregarTexto(o){
  if(CACHE_TXT[o.id])return CACHE_TXT[o.id];
  const idx=await S.db.doc("textos/op-"+o.id).get();const pags=[];
  if(idx.exists){const d=idx.data();const ids=[...Array(d.partes||0)].map((_,i)=>"op-"+o.id+"-"+(i+1)).concat(d.extras||[]);
    for(const i of ids){const t=await S.db.doc("textos/"+i).get();if(!t.exists)continue;let arq="edital";
      for(const bloco of t.data().texto.split(/(?=^=== ARQUIVO: )|(?=\[p\.\d+\] )/m)){const ma=bloco.match(/^=== ARQUIVO: (.*) ===/);if(ma){arq=ma[1];continue}const mp=bloco.match(/^\[p\.(\d+)\] ([\s\S]*)/);if(mp)pags.push({arquivo:arq,pagina:+mp[1],texto:mp[2]})}}}
  CACHE_TXT[o.id]=pags;return pags;
}
const TEMAS={habilitacao:/habilita[çc][ãa]o|certid[ãa]o|regularidade|atestado|balan[çc]o|qualifica[çc][ãa]o/i,prazos:/prazo|\d{2}\/\d{2}\/\d{4}|sess[ãa]o|impugna|esclarecimento|vig[êe]ncia|dias (úteis|corridos)/i,
  execucao:/execu[çc][ãa]o|entrega|implanta|local|equipe|cronograma|ordem de servi|n[íi]vel de servi|sla|suporte|manuten/i,itens:/item|lote|especifica[çc]|quantidade|unidade|descri[çc][ãa]o t[ée]cnica|termo de refer/i,
  riscos:/multa|penalidade|san[çc][ãa]o|garantia|rescis|glosa|pagamento|reajust|subcontrata/i};
function selecionarPaginas(pags,limiteBytes=170000){
  const pont=pags.map((p,i)=>{let s=0;for(const rx of Object.values(TEMAS))s+=(p.texto.match(new RegExp(rx.source,"gi"))||[]).length;return{i,s:s+(p.pagina<=3?20:0)}});
  const esc2=pont.sort((a,b)=>b.s-a.s);const pegar=new Set();let tam=0;
  for(const {i} of esc2){const t=pags[i].texto.length+40;if(tam+t>limiteBytes)continue;pegar.add(i);tam+=t}
  return [...pegar].sort((a,b)=>a-b).map(i=>`[${pags[i].arquivo} · p.${pags[i].pagina}] ${pags[i].texto}`).join("\n");
}
function datasNoTexto(pags){
  const out=[],vistos=new Set();const rx=/(\d{2}\/\d{2}\/\d{4})(?:[^\d\n]{0,12}(\d{1,2}(?:[h:]\d{2}|h)))?/g;
  const chave=/sess[ãa]o|abertura|propost|impugna|esclarecimento|recurso|vig[êe]ncia|entrega|in[íi]cio|encerramento|disputa|lances|habilita/i;
  for(const p of pags){let m;while((m=rx.exec(p.texto))){const ctx=p.texto.slice(Math.max(0,m.index-140),m.index+40).replace(/\s+/g," ");if(!chave.test(ctx))continue;const k=m[1]+ctx.slice(-60);if(vistos.has(k))continue;vistos.add(k);out.push({data:m[1],hora:m[2]||"",contexto:ctx,arquivo:p.arquivo,pagina:p.pagina})}}
  const prazos=[];const rp=/prazo[^.;\n]{0,90}?(\d{1,3})\s*(?:\([^)]{2,25}\))?\s*(dias?|horas?|meses|m[êe]s)\s*(úteis|corridos)?/gi;
  for(const p of pags){let m;while((m=rp.exec(p.texto))&&prazos.length<60){prazos.push({texto:m[0].replace(/\s+/g," ").slice(0,160),arquivo:p.arquivo,pagina:p.pagina})}}
  return {datas:out.slice(0,60),prazos};
}

function extenso(c){
  const u=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],d=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],ce=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999=n=>{if(n===100)return"cem";const p=[];if(n>=100){p.push(ce[Math.floor(n/100)]);n%=100}if(n>=20){p.push(d[Math.floor(n/10)]);n%=10;if(n)p.push(u[n])}else if(n)p.push(u[n]);return p.join(" e ")};
  const nomes=[["",""],["mil","mil"],["milhão","milhões"],["bilhão","bilhões"]];
  const r=Math.floor(c/100),cent=c%100;const grupos=[];let n=r,i=0;
  while(n>0){const g=n%1000;if(g)grupos.unshift({g,i,txt:i===0?ate999(g):i===1?(g===1?"mil":ate999(g)+" mil"):ate999(g)+" "+(g===1?nomes[i][0]:nomes[i][1])});n=Math.floor(n/1000);i++}
  let s="";grupos.forEach((x,k)=>{if(k===0)s=x.txt;else{const ult=k===grupos.length-1;s+=(ult&&(x.g<100||x.g%100===0)?" e ":" ")+x.txt}});
  if(r){const soMilhoes=grupos.length&&grupos[grupos.length-1].i>=2;s+=(soMilhoes?" de":"")+(r===1?" real":" reais")}
  if(cent)s+=(s?" e ":"")+ate999(cent)+(cent===1?" centavo":" centavos");
  return s||"zero real"}

function blocoAprovar(a){return `<form class="acoes" data-apr="${esc(a.id)}"><label style="min-width:200px">Para aprovar, digite <code>${esc(a.hash.slice(0,6))}</code><input name="cod" autocomplete="off" maxlength="6"></label><button class="b">Aprovar esta versão</button><button class="b sec" type="button" data-rej="${esc(a.id)}">Rejeitar</button><span class="erro"></span></form>`}
function ligarAprovacoes(){
  document.querySelectorAll("[data-apr]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const a=S.aprovacoes.find(x=>x.id===f.dataset.apr);const cod=new FormData(f).get("cod");
    if(cod!==a.hash.slice(0,6)){f.querySelector(".erro").textContent="Código não confere. Nada foi aprovado.";return}
    if(a.validade<new Date().toISOString()){await S.db.doc("aprovacoes/"+a.id).update({situacao:"expirada"});return}
    await S.db.doc("aprovacoes/"+a.id).update({situacao:"aprovada",decidido_em:new Date().toISOString(),canal:"pagina claude.ai"});
    await evento("aprovacao.aprovada","usuario:arthur",`Aprovado: ${a.resumo} (versão ${a.hash.slice(0,12)})`)});
  document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{const a=S.aprovacoes.find(x=>x.id===b.dataset.rej);await S.db.doc("aprovacoes/"+a.id).update({situacao:"rejeitada",decidido_em:new Date().toISOString()});await evento("aprovacao.rejeitada","usuario:arthur","Rejeitado: "+a.resumo)});
}

  ${c.situacao==="em_execucao"?`<form class="campos" data-ch="${esc(c.id)}"><label style="grid-column:1/-1">Novo chamado (o que acontece, desde quando, quem é afetado)<textarea name="t" required></textarea></label><button class="b">Abrir chamado</button>${S.sample?`<span class="sub" style="margin:0">A triagem é feita pelo analista de suporte com IA.</span>`:""}</form>

  ${en.length?`<div class="tab"><table><thead><tr><th>Entrega</th><th>Qtd</th><th>Evidência</th><th>Situação</th><th></th></tr></thead><tbody>${en.map(x=>`<tr><td>${esc(x.descricao)}</td><td class="m">${esc(x.quantidade)}</td><td>${esc(x.evidencia)}</td><td>${pill(x.situacao,x.situacao==="aceita"?"ok":"aviso")}</td><td>${S.dono&&x.situacao==="realizada"?`<button class="b sec" data-aceite="${esc(x.id)}">Cliente aceitou</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:""}

    f.onsubmit=async e=>{e.preventDefault();const n=new FormData(f).get("n");const c=S.contratos.find(x=>x.id===m.contrato);await S.db.doc("medicoes/"+m.id).update({nota:n});
      await S.db.collection("lancamentos").doc().set({tipo:"receber",categoria:"faturado",descricao:`NF ${n} — contrato ${c?.numero||""}`,valor:String(m.valor/100),vencimento:new Date(Date.now()+(c?.prazo_pagamento||30)*864e5).toISOString().slice(0,10),situacao:"aberto",criado_em:new Date().toISOString()});
      await evento("nota.registrada","agente:gestor-de-faturamento",`NF ${n} registrada: ${brl(m.valor)} a receber`)}});
};

/* ===================== AGENTES ===================== */
const DEPN={direcao:"Direção e supervisão",licitacoes:"Licitações",juridico:"Jurídico e conformidade",financeiro:"Financeiro, fiscal e contábil",compras:"Fornecedores e compras",engenharia:"Produto e engenharia de software",infra:"Infraestrutura, segurança e manutenção",operacao:"Operação contratual e serviços",comunicacao:"Comunicação e inteligência"};
V.agentes=()=>{
  if(!S.agentes.length)return `<section><h2>Agentes</h2><p class="sub">Carregando os agentes…</p></section>`;
  const a=S.agentes.find(x=>x.id===S.chatAg)||S.agentes[0];const msgs=(S.msgs[a.id]||[]);const q=(S.qAg||"").toLowerCase();
  const grupos={};for(const x of S.agentes){if(q&&!(x.nome+" "+x.missao).toLowerCase().includes(q))continue;(grupos[x.departamento]||=[]).push(x)}
  const st=S.estadoAg[a.id]||{};
  return `<section><h2>Agentes (${S.agentes.length})</h2><p class="sub">Todos os agentes do escritório, por departamento. Toque em um para conversar. Eles respondem com o Claude do seu plano, usando os dados deste escritório; números e cálculos vêm do sistema.</p></section>
  <section class="bloco" id="conversa"><div class="acoes"><b>${esc(a.numero)}. ${esc(a.nome)}</b> ${pill(st.estado||"disponivel",st.estado==="trabalhando"?"ok":st.estado==="bloqueado"?"critico":"neutro")} ${a.impl==="humano"?pill("apoia profissional humano","neutro"):pill("IA do seu plano","ia")}</div>
    <div class="sub" style="margin:0">${esc(a.missao)} · ${esc(DEPN[a.departamento]||a.departamento)}</div>
    <details><summary class="sub">Limites deste agente</summary><ul style="margin:6px 0">${(a.limites||[]).map(l=>`<li>${esc(l)}</li>`).join("")}</ul></details>
    ${st.ultimo?`<div class="sub" style="margin:0">Último: ${esc(st.ultimo)} · ${quando(st.ultimoEm)}</div>`:""}
    ${!S.sample?`<div class="aviso-box">IA indisponível nesta visualização.</div>`:""}
    <div class="chat" id="chat">${msgs.map(m=>`<div class="msg ${m.r==="user"?"eu":""}"><small>${m.r==="user"?"você":esc(a.nome)}</small>${esc(m.c)}</div>`).join("")||`<p class="sub">Exemplos: “Quais editais valem a pena esta semana?”, “Que documentos me faltam?”, “Quanto devo reservar de imposto?”</p>`}</div>
    <form class="acoes" id="f-chat"><input name="t" placeholder="Escreva para ${esc(a.nome)}" required style="flex:1;min-width:200px" autocomplete="off"><button class="b" ${S.sample?"":"disabled"}>Enviar</button></form><p class="erro" id="e-chat"></p></section>
  <label>Procurar agente<input id="q-ag" value="${esc(S.qAg||"")}" placeholder="ex.: preço, jurídico, OCR"></label>
  ${Object.entries(grupos).map(([d,xs])=>`<section class="bloco"><h3>${esc(DEPN[d]||d)} <span class="etq">${xs.length}</span></h3><div style="display:grid;gap:4px">${xs.map(x=>{const e=S.estadoAg[x.id]||{};return `<button class="b sec" style="text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center" data-ag="${esc(x.id)}" ${x.id===a.id?'aria-current="true"':""}><span><b>${x.numero}.</b> ${esc(x.nome)} <span class="sub" style="font-weight:400">— ${esc(x.missao.slice(0,70))}</span></span>${e.estado&&e.estado!=="disponivel"?pill(e.estado,e.estado==="trabalhando"?"ok":"critico"):e.ultimo?pill("ativo","neutro"):""}</button>`}).join("")}</div></section>`).join("")}`;
};
ligar.agentes=()=>{
  document.querySelectorAll("[data-ag]").forEach(b=>b.onclick=()=>{S.chatAg=b.dataset.ag;render(true);$("#conversa")?.scrollIntoView({behavior:"smooth",block:"start"})});
  const qa=$("#q-ag");if(qa)qa.oninput=()=>{S.qAg=qa.value;clearTimeout(S._qa);S._qa=setTimeout(()=>{render(true);const el=$("#q-ag");el.focus();el.setSelectionRange(el.value.length,el.value.length)},250)};
  const ch=$("#chat");if(ch)ch.scrollTop=ch.scrollHeight;
  $("#f-chat")&&($("#f-chat").onsubmit=async e=>{e.preventDefault();const a=S.agentes.find(x=>x.id===S.chatAg)||S.agentes[0];const inp=e.target.t,txt=inp.value;inp.value="";
    const hist=(S.msgs[a.id]||=[]);hist.push({r:"user",c:txt});render(true);
    const bolha=document.createElement("div");bolha.className="msg";bolha.textContent="Pensando…";$("#chat").append(bolha);
    const t=totais();const ctx={empresa:S.empresa,totais_em_centavos:t,
      licitacoes:S.ops.slice(0,25).map(o=>({objeto:o.objeto,orgao:o.orgao,uf:o.uf,estimado:o.valor_estimado,aderencia:o.aderencia,situacao:o.situacao,propostas_ate:o.data_sessao,itens:(o.itens||[]).length,
        analise:o.analise_ia?{recomendacao:o.analise_ia.recomendacao,riscos:(o.analise_ia.riscos||[]).slice(0,5),prazos:(o.analise_ia.prazos||[]).slice(0,8)}:null,docs_pendentes:(o.matriz||[]).filter(x=>x.situacao==="nao_atende").map(x=>x.descricao)})),
      documentos:S.documentos.filter(d=>!d.oportunidade).map(d=>({tipo:d.tipo,validade:d.validade})),contratos:S.contratos.map(c=>({numero:c.numero,orgao:c.orgao,situacao:c.situacao,valor:c.valor_total})),
      lancamentos_abertos:S.lanc.filter(l=>l.situacao==="aberto").map(l=>({tipo:l.tipo,descricao:l.descricao,valor:l.valor,vencimento:l.vencimento})),aprovacoes_pendentes:S.aprovacoes.filter(x=>x.situacao==="pendente").map(x=>x.resumo),hoje:hoje()};
    const regras=`Você é "${a.nome}" (${DEPN[a.departamento]}) do escritório digital da ${S.empresa?.razao_social||"DigitalGov"}. Missão: ${a.missao}. Limites: ${(a.limites||[]).join("; ")}.
Fale com Arthur Miguel (administrador) em português, direto e curto. Use SOMENTE os dados abaixo; se faltar dado, diga qual. Nunca diga que executou algo que não está nos dados. Aprovações são do Arthur, na página. "totais_em_centavos" está em centavos.
<dados_do_escritorio>${JSON.stringify(ctx).slice(0,150000)}</dados_do_escritorio>`;
    const turnos=[{role:"user",content:regras+"\n\nPergunta: "+hist[0].c}];for(let i=1;i<hist.length;i++)turnos.push({role:hist[i].r==="user"?"user":"assistant",content:hist[i].c});
    try{await setEstadoAg(a.id,{estado:"trabalhando",tarefa:"Respondendo: "+txt.slice(0,80),desde:new Date().toISOString()});
      const r=await S.sample(turnos,{modelTier:"default",cache:false,onText:({text})=>{bolha.textContent=text}});
      await setEstadoAg(a.id,{estado:"disponivel",tarefa:null});hist.push({r:"assistant",c:r.text});
      await evento("chat.resposta","agente:"+a.id,`Respondeu ao Arthur: "${txt.slice(0,60)}"`);render(true)}
    catch(x){await setEstadoAg(a.id,{estado:"disponivel",tarefa:null});bolha.remove();hist.pop();$("#e-chat").textContent=erroIA(x)}});
};

V.empresa=()=>{const e=S.empresa||{};return `<section><h2>Empresa</h2><p class="sub">Dados públicos da Receita Federal (consultados em ${esc(e.consultado_em||"—")}) e parâmetros que você definiu.</p></section>${somenteDono()}
  <section class="bloco"><div class="tab"><table><tbody>${[["Razão social",e.razao_social],["Nome fantasia",e.nome_fantasia],["CNPJ",e.cnpj_fmt],["Situação",e.situacao],["Porte",e.porte],["Regime",e.regime],["Município",e.municipio],["Início",e.inicio],["Capital social",e.capital_social?brl(centavos(e.capital_social)):"—"]].map(([k,v])=>`<tr><th>${k}</th><td>${esc(v||"—")}</td></tr>`).join("")}<tr><th>CNAEs</th><td>${(e.cnaes||[]).map(esc).join("<br>")}</td></tr></tbody></table></div></section>
  ${S.dono?`<form class="bloco campos" id="f-par"><label>Imposto efetivo % (Simples)<input name="aliq" value="${esc(e.aliquota_efetiva_pct??18)}" inputmode="decimal"></label><label>Margem mínima %<input name="mmin" value="${esc(e.margem_minima_pct??10)}" inputmode="decimal"></label><label>Capital de giro disponível (R$)<input name="giro" value="${esc(e.capital_giro??0)}" inputmode="decimal"></label><label>Fonte do imposto<select name="fonte"><option value="administrador" ${e.aliquota_fonte!=="contador"?"selected":""}>Informado por mim</option><option value="contador" ${e.aliquota_fonte==="contador"?"selected":""}>Validado pelo contador</option></select></label><button class="b">Salvar parâmetros</button></form>`:""}
  <section class="bloco"><h3>Serviços que vendo</h3><p class="sub" style="margin:0">As palavras-chave definem quais editais do PNCP entram aqui.</p>${S.servicos.map(s=>`<div><b>${esc(s.nome)}</b><div class="sub" style="margin:0">${esc(s.palavras_chave)}</div></div>`).join("")}</section>`};
ligar.empresa=()=>{$("#f-par")&&($("#f-par").onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));await S.db.doc("cfg/empresa").update({aliquota_efetiva_pct:+String(d.aliq).replace(",","."),margem_minima_pct:+String(d.mmin).replace(",","."),capital_giro:String(centavos(d.giro)/100),aliquota_fonte:d.fonte});await evento("empresa.parametros","usuario:arthur",`Parâmetros: imposto ${d.aliq}%, margem mínima ${d.mmin}%`)})};

try{const a=localStorage.getItem("aba");if(a&&ABAS.some(x=>x[0]===a))S.aba=a}catch{}
iniciar();
</script>
