[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "broker"
version = "0.1.0"
description = "Plataforma de Gestão Multinuvem e Portal de Gerenciamento — Cloud Broker CVM (PE 90016/2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "celery>=5.4",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "celery-types>=0.22",
  "types-redis>=4.6",
]

[project.scripts]
broker = "broker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["broker"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/aceitacao", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em pt-BR usam acentos e travessões

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"broker/adapters/persistence/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["broker"]
exclude = ["broker/adapters/persistence/migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requer Postgres e Redis em execução"]

[tool.coverage.run]
source = ["broker"]
branch = true
